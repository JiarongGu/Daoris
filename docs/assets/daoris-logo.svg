<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36">
  <!-- The README's logo (GITHUBDOCS1, D211): the seal of `src/Daoris.Web/src/design/Mark.tsx` and
       `tools/make-icon.py` at a declared 36 px, beside the title. Markdown cannot size an image and a
       registry renders no HTML, so the size lives here. The drawing is daoris-icon.svg's; move them together. -->
  <rect width="24" height="24" rx="5.5" fill="#7a5c2e" mask="url(#m)"/>
  <mask id="m">
    <rect width="24" height="24" fill="white"/>
    <g stroke="black" stroke-width="2.4" stroke-linecap="round">
      <line x1="12" y1="12" x2="12" y2="5.6"/>
      <line x1="12" y1="12" x2="12" y2="5.6" transform="rotate(120 12 12)"/>
      <line x1="12" y1="12" x2="12" y2="5.6" transform="rotate(240 12 12)"/>
    </g>
    <circle cx="12" cy="12" r="2.6" fill="black"/>
  </mask>
</svg>
