name: Release

# Manual-trigger only, matching the family release model: cutting a release is a
# deliberate act started from the Actions tab. There is intentionally NO
# tag-push trigger and NO push/PR CI — a release is the only thing that runs here.
#
# The irreversible publish happens BEFORE the version-bump commit, so a failed
# release burns no version number and leaves no phantom commit.
#
# ⚠ `draft: true` is NOT a dry run. It only makes the GitHub Release a draft; the
# npm publish has already happened by then, and npm allows an unpublish only
# briefly and only for a brand-new package. Rehearse with `dry_run: true`, which
# runs the gates and the pack and then publishes nothing and touches no git.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version (e.g. 0.1.0) — leave empty to bump'
        required: false
        default: ''
      bump:
        description: 'Bump kind when version is empty'
        type: choice
        options: [none, patch, minor, major]
        default: patch
      create_tag:
        description: 'Create + push the vX.Y.Z tag'
        type: boolean
        default: true
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: true
      dry_run:
        description: 'DRY RUN — gate + pack, then publish NOTHING and touch no git'
        type: boolean
        default: true

permissions:
  contents: write   # the bump commit, the tag, the release
  id-token: write   # OIDC for npm provenance / trusted publishing

jobs:
  # The devkit ships as a self-contained binary per platform, so it cannot be cross-compiled from one
  # runner: native AOT needs the TARGET platform's linker. One job per platform, each publishing its own
  # binary and its sha256 — that digest is the whole of D27's distribution story, because a consuming
  # repository records it and verifies OFFLINE against a local file rather than trusting the download.
  #
  # Runs even on a dry run. Building the artefact is exactly what a rehearsal should prove, and this is
  # the half of a release that has never been exercised anywhere else — there is no push CI.
  devkit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest,   rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test src/Daoris.Devkit --nologo

      - name: Publish ${{ matrix.rid }}
        shell: bash
        run: |
          dotnet publish src/Daoris.Devkit/Daoris.Devkit.Cli -c Release -r ${{ matrix.rid }}             -o "publish/${{ matrix.rid }}"

      # The name carries the platform because all three land in one release, and a bare `daoris-devkit`
      # downloaded from the wrong row is a confusing failure rather than an obvious one.
      - name: Name and hash the artefact
        shell: bash
        run: |
          cd "publish/${{ matrix.rid }}"
          src=daoris-devkit; [ -f "$src.exe" ] && src=daoris-devkit.exe
          out="daoris-devkit-${{ matrix.rid }}"; case "$src" in *.exe) out="$out.exe";; esac
          mv "$src" "$out"
          # Written beside the binary rather than printed: the digest is the thing consumers record, so
          # it has to survive as a file rather than as a line in a build log.
          if command -v sha256sum >/dev/null; then sha256sum "$out" > "$out.sha256"
          else shasum -a 256 "$out" > "$out.sha256"; fi
          cat "$out.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: devkit-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}/daoris-devkit-*
          if-no-files-found: error

  release:
    needs: devkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for release notes

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Determine version
        id: version
        run: |
          current=$(node -p "require('./src/Daoris.Cli/package.json').version")
          req='${{ inputs.version }}'
          if [ -n "$req" ]; then
            final="$req"
          else
            IFS=. read -r a b c <<< "$current"
            case '${{ inputs.bump }}' in
              none)  final="$current" ;;
              patch) final="$a.$b.$((c+1))" ;;
              minor) final="$a.$((b+1)).0" ;;
              major) final="$((a+1)).0.0" ;;
            esac
          fi
          # Rewrites the working tree only — the commit is deferred until after
          # the publish succeeds. Also stamps both changelogs, and FAILS if the
          # unreleased section is missing or empty: that is far more often a sign
          # the commits you meant to ship are not on the remote than a sign that
          # someone forgot to write prose.
          node tools/release-prep.mjs --version "$final"
          echo "version=$final" >> "$GITHUB_OUTPUT"
          echo "tag=v$final" >> "$GITHUB_OUTPUT"
          echo "current=$current -> final=$final"

      # Everything that protects a consumer, in the order a consumer meets it.
      - name: Verify gate
        run: npm run verify

      - name: Release rehearsal
        run: npm run rehearse

      # Packed from the package directory, where `prepack` stages the canon, the
      # licence and the readme in from the workspace root.
      - name: Pack
        run: npm pack --pack-destination ../../publish
        working-directory: src/Daoris.Cli

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY RUN — nothing published, no git state changed."
          echo "  version that WOULD ship: ${{ steps.version.outputs.version }}"
          ls -la publish/

      # Publishes the tarball `Pack` produced rather than re-packing, so the
      # artefact the gates ran against is the artefact that ships.
      #
      # Idempotent: npm has no --skip-duplicate and fails hard when the version
      # exists, which would otherwise leave every re-run stuck here — unable to
      # ever reach the bump commit or the tag after a partial failure.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v='${{ steps.version.outputs.version }}'
          if [ "$(npm view "daoris@$v" version 2>/dev/null)" = "$v" ]; then
            echo "daoris@$v is already published — skipping"
          else
            npm publish "publish/daoris-$v.tgz" --provenance --access public
          fi

      - name: Commit the version bump
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Named explicitly so no build artefact can ride along into a release commit.
          git add src/Daoris.Cli/package.json canon/canon.json daoris.json README.md CHANGELOG.md canon/CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          git push

      - name: Create tag
        if: ${{ inputs.create_tag && !inputs.dry_run }}
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists — leaving it"
          else
            git tag -a "$tag" -m "Daoris ${{ steps.version.outputs.version }}"
            git push origin "$tag"
          fi

      - name: Collect the devkit binaries
        if: ${{ inputs.create_tag && !inputs.dry_run }}
        uses: actions/download-artifact@v4
        with:
          pattern: devkit-*
          path: publish/devkit
          merge-multiple: true

      - name: Create GitHub release
        if: ${{ inputs.create_tag && !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Daoris ${{ steps.version.outputs.version }}
          body: 'See CHANGELOG.md.'
          draft: ${{ inputs.draft }}
          # The binaries AND their .sha256 files. A digest published only in the release notes is one
          # nobody can script against; published as a file beside the artefact, it can be recorded into
          # a consuming repository and checked there without a network (D27).
          files: publish/devkit/*
