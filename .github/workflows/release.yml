name: Release

# Manual-trigger only, matching the family release model: cutting a release is a
# deliberate act started from the Actions tab. There is intentionally NO
# tag-push trigger and NO push/PR CI — a release is the only thing that runs here.
#
# The irreversible publish happens BEFORE the version-bump commit, so a failed
# release burns no version number and leaves no phantom commit.
#
# ⚠ `draft: true` is NOT a dry run. It only makes the GitHub Release a draft; the
# npm publish has already happened by then, and npm allows an unpublish only
# briefly and only for a brand-new package. Rehearse with `dry_run: true`, which
# runs the gates and the pack and then publishes nothing and touches no git.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version (e.g. 0.1.0) — leave empty to bump'
        required: false
        default: ''
      bump:
        description: 'Bump kind when version is empty'
        type: choice
        options: [none, patch, minor, major]
        default: patch
      create_tag:
        description: 'Create + push the vX.Y.Z tag'
        type: boolean
        default: true
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: true
      dry_run:
        description: 'DRY RUN — gate + pack, then publish NOTHING and touch no git'
        type: boolean
        default: true

permissions:
  contents: write   # the bump commit, the tag, the release
  id-token: write   # OIDC for npm provenance / trusted publishing

jobs:
  # The per-platform binaries: the devkit (native AOT, so it needs the TARGET platform's linker) and
  # the service's two hosts (self-contained single-file, deliberately NOT trimmed or AOT — the MCP SDK
  # discovers tools by reflection; D43). Each artefact ships with its sha256 — that digest is the whole
  # of D27's distribution story, because a consuming repository records it and verifies OFFLINE against
  # a local file rather than trusting the download.
  #
  # Runs even on a dry run. Building the artefacts is exactly what a rehearsal should prove, and this is
  # the half of a release that has never been exercised anywhere else — there is no push CI.
  devkit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest,   rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test src/Daoris.Devkit --nologo

      - name: Publish ${{ matrix.rid }}
        shell: bash
        run: |
          dotnet publish src/Daoris.Devkit/Daoris.Devkit.Cli -c Release -r ${{ matrix.rid }}             -o "publish/${{ matrix.rid }}"

      # The name carries the platform because all three land in one release, and a bare `daoris-devkit`
      # downloaded from the wrong row is a confusing failure rather than an obvious one.
      - name: Name and hash the artefact
        shell: bash
        run: |
          cd "publish/${{ matrix.rid }}"
          src=daoris-devkit; [ -f "$src.exe" ] && src=daoris-devkit.exe
          out="daoris-devkit-${{ matrix.rid }}"; case "$src" in *.exe) out="$out.exe";; esac
          mv "$src" "$out"
          # Written beside the binary rather than printed: the digest is the thing consumers record, so
          # it has to survive as a file rather than as a line in a build log.
          if command -v sha256sum >/dev/null; then sha256sum "$out" > "$out.sha256"
          else shasum -a 256 "$out" > "$out.sha256"; fi
          cat "$out.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: devkit-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}/daoris-devkit-*
          if-no-files-found: error

      # The service hosts (D43). The HTTP host's web bundle travels as a wwwroot directory beside its
      # executable, so that one ships as an archive; the MCP host is a single file.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Web bundle (rides inside the HTTP host archive)
        run: |
          npm --prefix src/Daoris.Web ci
          npm --prefix src/Daoris.Web run build

      - name: Publish the service hosts (${{ matrix.rid }})
        run: node tools/service-publish.mjs --rid ${{ matrix.rid }}

      - name: Name and hash the service artefacts
        shell: bash
        run: |
          cd "publish/service/${{ matrix.rid }}"
          mcp=daoris-knowledge/daoris-knowledge; [ -f "$mcp.exe" ] && mcp="$mcp.exe"
          out="daoris-knowledge-${{ matrix.rid }}"; case "$mcp" in *.exe) out="$out.exe";; esac
          cp "$mcp" "$out"
          tar -czf "daoris-knowledge-http-${{ matrix.rid }}.tar.gz" -C daoris-knowledge-http .
          hash() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          hash "$out" > "$out.sha256"
          hash "daoris-knowledge-http-${{ matrix.rid }}.tar.gz" > "daoris-knowledge-http-${{ matrix.rid }}.tar.gz.sha256"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: service-${{ matrix.rid }}
          path: |
            publish/service/${{ matrix.rid }}/daoris-knowledge-${{ matrix.rid }}*
            publish/service/${{ matrix.rid }}/daoris-knowledge-http-${{ matrix.rid }}*
          if-no-files-found: error

  # The deployed artefact (DEPLOY2). The shell is `net10.0-windows`, so this is the one gate that
  # cannot run beside the others on Linux — and the thing it proves only exists once the application
  # has been installed somewhere and started from there: the host a locator can see, and a transcript
  # written through something other than a console's codepage. Both defects were found by deploying,
  # and both were invisible from inside the workspace.
  #
  # It starts a real window, so it needs a desktop session and the Evergreen WebView2 runtime on the
  # runner. No model, no account, no credential.
  #
  # ⚠ UNRUN. Nothing runs on push here, so this job has only ever executed as `npm run rehearse:deploy`
  # on a developer's Windows machine — where it passes 29/29. Whether a hosted runner can bring the
  # window up is not something this repository has observed, and the first dispatch is where it will
  # be found out. Declared anyway: an undeclared gate is the failure the gate-list test exists to
  # catch, and a gate that has to be argued into the workflow later never is.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The publish builds the platform bundle into the host's wwwroot, so the web workspace's own
      # dependencies have to be present before anything is published.
      - name: Web dependencies
        run: npm --prefix src/Daoris.Web ci

      - name: Deployment rehearsal
        run: npm run rehearse:deploy

  release:
    needs: [devkit, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for release notes

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # The root workspace, TypeScript included (REV3). `verify` opens with `tsc --noEmit` and `Pack`'s
      # prepack compiles the CLI; with nothing installed both fail on a fresh runner, and this job had
      # never installed the root in its whole history — it has never been dispatched.
      - name: Dependencies
        run: npm ci

      # For the family rehearsal below — it spawns the real HTTP host over the example projects.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        run: |
          current=$(node -p "require('./src/Daoris.Cli/package.json').version")
          req='${{ inputs.version }}'
          if [ -n "$req" ]; then
            final="$req"
          else
            IFS=. read -r a b c <<< "$current"
            case '${{ inputs.bump }}' in
              none)  final="$current" ;;
              patch) final="$a.$b.$((c+1))" ;;
              minor) final="$a.$((b+1)).0" ;;
              major) final="$((a+1)).0.0" ;;
            esac
          fi
          # Rewrites the working tree only — the commit is deferred until after
          # the publish succeeds. Also stamps both changelogs, and FAILS if the
          # unreleased section is missing or empty: that is far more often a sign
          # the commits you meant to ship are not on the remote than a sign that
          # someone forgot to write prose.
          node tools/release-prep.mjs --version "$final"
          echo "version=$final" >> "$GITHUB_OUTPUT"
          echo "tag=v$final" >> "$GITHUB_OUTPUT"
          echo "current=$current -> final=$final"

      # 🔴 The canon's version is in every provenance header and every lock `sync` writes, so the bump
      # above leaves this repository's own doctrine and both examples one version behind — and the
      # family rehearsal's first check ("sync changed nothing tracked") red on every release that moves
      # the version (REV3). Re-synced here, and committed with the bump below.
      - name: Re-sync the doctrine at the new version
        run: |
          node src/Daoris.Cli/bin/daoris.mjs sync
          for example in examples/*/; do
            if [ -f "$example/daoris.json" ]; then
              (cd "$example" && node ../../src/Daoris.Cli/bin/daoris.mjs sync)
            fi
          done

      # The committed code map is what the project files say (MAP3c) — a fact, so it gates (D54). It is
      # a DECLARED gate rather than a universal one: a map an agent or a person wrote for another stack
      # is not the devkit's to judge, and nothing in the file says which producer wrote it.
      - name: Code map gate
        run: dotnet run --project src/Daoris.Devkit/Daoris.Devkit.Cli -- map --check

      # Everything that protects a consumer, in the order a consumer meets it — ending with the devkit's
      # five universal gates over THIS repository (DEVKIT3, SEN1). They ran here as a step of their own
      # as well, the same command twice (REV3 CLEAN1); `verify` is their one home, and the dogfood test
      # counts a gate `verify` runs as run.
      #
      # `--universal-only` is not a shortcut: the devkit's `verify` runs the declared gates too, so the
      # full form would reach its own row and start itself. `--allow-builtins-only` is the explicit
      # opt-out the sensitive gate requires when the private pattern list is absent, which on a runner
      # it always is — that list holds names that cannot live in the repository being scanned. Locally
      # the list exists, and the same scan knows them; no pre-commit hook is installed here
      # (`install-hooks` is the owner's to run). CI gets the structural patterns, and says so rather
      # than discovering it silently.
      - name: Verify gate
        run: npm run verify

      # The two .NET suites this job used to skip entirely. The rehearsals below drive the service and
      # the driver end to end, which is why the gap survived a release rehearsal and eight landings —
      # an end-to-end pass is not a substitute for the unit judgement underneath it, and a store rule
      # or a payload guard can break without any rehearsal noticing. Both target plain net10.0, so
      # there was never a portability reason either.
      #
      # `src/Daoris.Service` is a folder holding one solution, so this runs every suite the solution
      # lists — the HTTP host's in-process suite included (HTTP1). A dogfood test holds that every test
      # project is in a solution a declared gate runs, or named by one.
      - name: Service gate
        run: dotnet test src/Daoris.Service --nologo

      # Each desktop suite runs as two gates (MOD8): the tests that start real processes or run real
      # ticks carry the `Process` category and run one class at a time after the rest
      # (`process.runsettings`), which is how the parent's merge runs them too. They are the ones load
      # has failed (FLAKE1).
      - name: Driver gate
        run: dotnet test src/Daoris.Desktop/Daoris.Desktop.Driver.Tests --filter Category!=Process --nologo

      # The shell's head — every IPC module the platform page talks to. Plain net10.0 precisely so it
      # runs here: the window is Windows-only, what it answers is not.
      - name: Desktop modules gate
        run: dotnet test src/Daoris.Desktop/Daoris.Desktop.Modules.Tests --filter Category!=Process --nologo

      - name: Driver process gate
        run: dotnet test src/Daoris.Desktop/Daoris.Desktop.Driver.Tests --settings src/Daoris.Desktop/process.runsettings --nologo

      - name: Desktop modules process gate
        run: dotnet test src/Daoris.Desktop/Daoris.Desktop.Modules.Tests --settings src/Daoris.Desktop/process.runsettings --nologo

      - name: Release rehearsal
        run: npm run rehearse

      # The router's proof (D39): two example projects, registration, a quest's whole life, a restart.
      # A release that ships the doctrine lifecycle but not the routing one is a quarter of the product.
      - name: Family rehearsal
        run: npm run rehearse:family

      # The platform's proof (D42): Playwright drives the shipped bundle over the example family —
      # members visible, a quest through its whole life in the drawers, the verbatim refusal, 中文.
      - name: Web dependencies
        run: npm --prefix src/Daoris.Web ci

      - name: Playwright browser
        run: npm --prefix src/Daoris.Web exec -- playwright install --with-deps chromium

      - name: Web end-to-end
        run: npm run test:web

      # Packed from the package directory, where `prepack` stages the canon, the
      # licence and the readme in from the workspace root.
      - name: Pack
        # npm writes into the destination without making it, and nothing earlier in this job does (REV3).
        run: |
          mkdir -p ../../publish
          npm pack --pack-destination ../../publish
        working-directory: src/Daoris.Cli

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY RUN — nothing published, no git state changed."
          echo "  version that WOULD ship: ${{ steps.version.outputs.version }}"
          ls -la publish/

      # Publishes the tarball `Pack` produced rather than re-packing, so what ships is exactly what Pack
      # made once every gate above had passed. (The release rehearsal packs a tarball of its own from the
      # same tree and drives that one; this one no gate touched.)
      #
      # Idempotent: npm has no --skip-duplicate and fails hard when the version
      # exists, which would otherwise leave every re-run stuck here — unable to
      # ever reach the bump commit or the tag after a partial failure.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v='${{ steps.version.outputs.version }}'
          if [ "$(npm view "daoris@$v" version 2>/dev/null)" = "$v" ]; then
            echo "daoris@$v is already published — skipping"
          else
            npm publish "publish/daoris-$v.tgz" --provenance --access public
          fi

      - name: Commit the version bump
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Tracked files only (`-u`), under exactly the places release-prep and the re-sync write, so no
          # build artefact can ride along — and none of what they wrote is left behind (REV3): the example
          # manifests release-prep pins were missing here, and `verify` went red on main after a release.
          git add -u -- src/Daoris.Cli/package.json canon daoris.json daoris.lock AGENTS.md CLAUDE.md .claude \
            README.md CHANGELOG.md examples src/Daoris.Devkit/Daoris.Devkit.Cli/Repository.cs
          git diff --cached --quiet || git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          git push

      - name: Create tag
        if: ${{ inputs.create_tag && !inputs.dry_run }}
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists — leaving it"
          else
            git tag -a "$tag" -m "Daoris ${{ steps.version.outputs.version }}"
            git push origin "$tag"
          fi

      - name: Collect the binaries
        if: ${{ inputs.create_tag && !inputs.dry_run }}
        uses: actions/download-artifact@v4
        with:
          pattern: '{devkit,service}-*'
          path: publish/devkit
          merge-multiple: true

      - name: Create GitHub release
        if: ${{ inputs.create_tag && !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Daoris ${{ steps.version.outputs.version }}
          body: 'See CHANGELOG.md.'
          draft: ${{ inputs.draft }}
          # The binaries AND their .sha256 files. A digest published only in the release notes is one
          # nobody can script against; published as a file beside the artefact, it can be recorded into
          # a consuming repository and checked there without a network (D27).
          files: publish/devkit/*
